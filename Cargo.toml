[package]
name = "phoenix_engine"
version = "0.1.0"
edition = "2021"
authors = ["Phoenix Engine Team"]
description = "A powerful 2D action-adventure game engine with Python scripting support"
license = "MIT"

[dependencies]
# GUI Framework
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }

# Graphics & Rendering
wgpu = "22.0"
image = "0.25"
glam = "0.29"  # Math library for vectors and matrices

# Audio
rodio = "0.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Python Integration (optional - requires compatible Python version)
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }

# Entity Component System
hecs = "0.10"

# File system
notify = "6.1"
directories = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Random numbers
rand = "0.8"

# Time
instant = "0.1"

# UUID for entity IDs
uuid = { version = "1.10", features = ["v4", "serde"] }

# File dialogs
rfd = "0.14"

# Date/time
chrono = "0.4"

[features]
default = []
python = ["dep:pyo3"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
